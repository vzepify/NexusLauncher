name: Build and Test Nexus Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-linux:
    name: Build Linux Launcher
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6svg6-dev \
            libcurl4-openssl-dev \
            unzip \
            tar

      - name: Configure
        run: |
          cmake \
            -S LinuxNexusLauncher \
            -B LinuxNexusLauncher/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build LinuxNexusLauncher/build \
            --config Release \
            -j2

      - name: Verify executable exists
        run: |
          test -f LinuxNexusLauncher/build/NexusLauncher
          chmod +x LinuxNexusLauncher/build/NexusLauncher
          file LinuxNexusLauncher/build/NexusLauncher

      - name: Package
        run: |
          mkdir -p package
          cp LinuxNexusLauncher/build/NexusLauncher package/
          chmod +x package/NexusLauncher

          tar -czf NexusLauncher-linux-x64.tar.gz \
            -C package \
            NexusLauncher

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: NexusLauncher-linux-x64
          path: NexusLauncher-linux-x64.tar.gz

  test-linux-launcher:
    name: Test Linux Launcher
    needs: build-linux
    runs-on: ubuntu-24.04

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libgl1 \
            libglu1-mesa \
            tar

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: NexusLauncher-linux-x64
          path: artifact

      - name: Extract launcher
        run: |
          mkdir -p launcher
          tar -xzf artifact/NexusLauncher-linux-x64.tar.gz \
            -C launcher

          chmod +x launcher/NexusLauncher

      - name: Check executable
        run: |
          test -f launcher/NexusLauncher
          file launcher/NexusLauncher

      - name: Launch Nexus under virtual display
        env:
          DISPLAY: :99
          QT_QPA_PLATFORM: xcb
          QT_DEBUG_PLUGINS: 1
        run: |
          set +e

          echo "Starting Xvfb..."

          Xvfb :99 \
            -screen 0 1280x720x24 \
            > xvfb.log 2>&1 &

          XVFB_PID=$!

          sleep 3

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "::error::Xvfb failed to start"
            cat xvfb.log
            exit 1
          fi

          echo "Starting Nexus Launcher..."

          timeout --preserve-status --signal=TERM 20s \
            ./launcher/NexusLauncher \
            > nexus_stdout.log \
            2> nexus_stderr.log

          EXIT_CODE=$?

          echo ""
          echo "===== Nexus stdout ====="
          cat nexus_stdout.log || true

          echo ""
          echo "===== Nexus stderr ====="
          cat nexus_stderr.log || true

          echo ""
          echo "===== Xvfb ====="
          cat xvfb.log || true

          echo ""
          echo "===== Exit code ====="
          echo "$EXIT_CODE"

          kill "$XVFB_PID" 2>/dev/null || true

          case "$EXIT_CODE" in

            0)
              echo "Nexus exited normally."
              ;;

            124)
              echo "Nexus stayed running for 20 seconds."
              echo "Startup test PASSED."
              ;;

            134)
              echo "::error::Nexus aborted with exit code 134."
              exit 1
              ;;

            139)
              echo "::error::Nexus crashed with segmentation fault (139)."
              exit 1
              ;;

            *)
              echo "::error::Nexus failed during startup."
              echo "::error::Exit code: $EXIT_CODE"
              exit 1
              ;;

          esac

      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusLauncher-linux-startup-logs
          path: |
            nexus_stdout.log
            nexus_stderr.log
            xvfb.log
